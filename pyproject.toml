[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shannon-hoard"
version = "0.1.0"
description = "Local electronics workbench: wiring, limits and firmware checked together, sensor accuracy with tolerances"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "fastapi==0.162.0", "uvicorn==0.54.0", "mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["shannon*"]

[tool.setuptools.package-data]
shannon = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
